<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Form</title>

    <style>
        /* General styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            padding: 20px;
        }

        /* Login container */
        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Heading */
        .login-container h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #243b55;
        }

        .login-container p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        /* Form labels */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        /* Input fields */
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #243b55;
            box-shadow: 0 0 5px rgba(36, 59, 85, 0.3);
        }

        /* Password wrapper */
        .password-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 7px;
            overflow: hidden;
        }

        .password-wrapper input {
            border: none;
            box-shadow: none;
        }

        .password-wrapper input:focus {
            box-shadow: none;
        }

        .password-wrapper button {
            border: none;
            background: white;
            padding: 12px;
            cursor: pointer;
            color: #243b55;
        }

        /* Remember me and forgot password */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .options a,
        .register a {
            color: #243b55;
            text-decoration: none;
        }

        .options a:hover,
        .register a:hover {
            text-decoration: underline;
        }

        /* Login button */
        .login-button {
            width: 100%;
            padding: 13px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #141e30;
        }

        /* Feedback message */
        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        /* Register link */
        .register {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Welcome Back!</h1>
        <p>Please log in to your account.</p>

        <form id="loginForm">

            <!-- Email -->
            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >
            </div>

            <!-- Password -->
            <div class="input-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        Show
                    </button>
                </div>
            </div>

            <!-- Options -->
            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="rememberMe">
                    Remember Me
                </label>

                <a href="forgot-password.html">
                    Forgot Password?
                </a>
            </div>

            <!-- Login button -->
            <button type="submit" class="login-button">
                Login
            </button>

            <div id="message" role="status" aria-live="polite"></div>

        </form>

        <!-- Registration link -->
        <div class="register">
            Don't have an account?
            <a href="register.html">Sign Up</a>
        </div>

    </div>

    <script>
        // Show or hide password
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            togglePassword.textContent = isHidden ? "Hide" : "Show";

            togglePassword.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        });

        // Handle login form
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                message.style.color = "red";
                message.textContent = "Please fill in all fields.";
                return;
            }

            message.style.color = "#243b55";
            message.textContent =
                "Form submitted! Connect a secure login system to verify your account.";
        });
    </script>

</body>
</html>
